<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aqoon Kaab Accounting</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--mid:#001f3f;--mid2:#0b3160;--cy:#d4101b;--or:#f49b2f;--bg:#eef3f7;--card:#fff;--tx:#0f1b2d;--mu:#62748a;--bd:#dde5ee;--rd:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#00162d;--card:#0a2a50;--tx:#e8f0f8;--mu:#93a8c0;--bd:#173d6a}}
:root[data-theme="dark"]{--bg:#00162d;--card:#0a2a50;--tx:#e8f0f8;--mu:#93a8c0;--bd:#173d6a}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 'Plus Jakarta Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.sb{width:230px;background:var(--mid);color:#fff;padding:14px 10px;position:fixed;top:0;bottom:0;left:0;overflow:auto;z-index:20;transition:transform .2s}
.lg{padding:6px 4px;margin-bottom:22px}.lg img{width:100%;display:block}
.nv{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:#c9d8ea;padding:11px 12px;border-radius:10px;text-align:left;cursor:pointer;font-weight:600}
.nv.on{background:var(--cy);color:var(--mid)}.nv:hover:not(.on){background:var(--mid2)}
.mn{margin-left:230px;flex:1;min-width:0;padding:18px}
.tb{display:none;position:sticky;top:0;z-index:10;background:var(--mid);color:#fff;padding:8px 12px;align-items:center;gap:10px}
.tb img{height:46px;max-width:68vw;object-fit:contain}.tb button{margin-left:auto;background:var(--cy);border:0;border-radius:8px;padding:8px 12px;font-weight:800;color:var(--mid)}
h1{font-size:22px;margin:0 0 14px;font-weight:800}h3{margin:18px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.c small{color:var(--mu);display:block}.c b{font-size:20px}
.c.hl{background:var(--mid);color:#fff;border:0}.c.hl small{color:#9fc0e4}.c.hl b{color:var(--cy)}
.pos{color:#12a37f}.neg{color:var(--rd)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar input,.bar select{flex:1;min-width:120px}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
.btn{background:var(--cy);color:var(--mid);border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;white-space:nowrap}
.btn.s{background:var(--card);border:1px solid var(--bd);color:var(--tx)}.btn.d{background:var(--rd);color:#fff}.btn.o{background:var(--or);color:#2a1700}
.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--mid);color:#fff;font-weight:600;font-size:13px}td.a{display:flex;gap:5px}
.bd{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800;background:#dff7f2;color:#0a7a66}
.bd.Unpaid,.bd.Inactive,.bd.Draft{background:#e7ecf2;color:#445}.bd.Overdue,.bd.Cancelled{background:#fde3e4;color:#b3252b}.bd.Partially{background:#ffecd0;color:#a05a00}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--mu)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chips span{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:5px 12px;font-size:13px}.chips b{color:#0a9f87}
#md{display:none;position:fixed;inset:0;background:rgba(0,20,45,.6);z-index:50;overflow:auto;padding:12px}#md.on{display:block}
.mb{background:var(--card);border-radius:16px;max-width:560px;margin:0 auto;padding:16px}.mb.w{max-width:760px}
.mb label{display:block;margin-bottom:10px;font-weight:600;font-size:13px}.mb label input,.mb label select,.mb label textarea{margin-top:4px;font-weight:400;font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ck{display:flex!important;gap:8px;align-items:center}.ck input{width:auto;margin:0}
.ir{display:grid;grid-template-columns:2fr .7fr 1fr auto;gap:6px;margin-bottom:6px}
.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:99;display:flex;flex-direction:column;gap:6px}
.t{background:var(--mid);color:#fff;border-left:5px solid var(--cy);padding:10px 14px;border-radius:10px;box-shadow:0 4px 14px #0005}.t.err{border-color:var(--rd)}
.lgn{min-height:100vh;display:grid;place-items:center;background:var(--mid);padding:16px}.lgn .box{background:#fff;color:#0f1b2d;border-radius:18px;padding:22px;width:100%;max-width:380px}
.lgn .box img{width:100%}.lgn label{display:block;font-weight:600;margin:10px 0}.lgn input{background:#fff;color:#0f1b2d}
.inv{color:#0f1b2d;background:#fff;padding:6px}.inv img.l{max-height:46px;max-width:190px;width:auto;display:block}.inv .sg{display:flex;justify-content:flex-end;margin-top:18px}.inv .sg>div{min-width:210px;font-size:13px}.inv .sl{height:48px;border-bottom:1px solid #333;display:flex;align-items:flex-end}.inv .sl img{height:44px}.inv .mer{margin-top:16px;font-weight:700}.ct{color:#4a5a70;margin:10px 0 18px;line-height:1.6}.ih{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}.ih .tt{order:2}.inv td,.inv th{white-space:normal;padding:8px 6px;font-size:13px}.inv td:nth-child(n+2),.inv th:nth-child(n+2){text-align:right}@media(max-width:560px){.ih{flex-direction:column}.ih .tt{order:0;text-align:left}}.inv table{min-width:0}.inv th{background:#c40812}.inv .tt{text-align:right;line-height:1.7}
.sv{width:100%;height:190px}.ir{align-items:center}.ir .btn{padding:8px 0}@media(max-width:560px){.ir{grid-template-columns:1fr 1fr 44px}.ir>div:first-child{grid-column:1/-1}}
@media(max-width:820px){.sb{transform:translateX(-100%)}.sb.on{transform:none}.mn{margin-left:0;padding:12px}.tb{display:flex}.g2{grid-template-columns:1fr}}
.pro{display:none}
@media print{:root,:root[data-theme],:root:not([data-theme="light"]){--bg:#fff;--card:#fff;--tx:#111;--mu:#555;--bd:#ccc;--out:#fff}body{background:#fff}body>#ts,.sb,.tb,.np,.bar,.hr,.pg,.chips .btn,td.a,th:last-child:empty{display:none!important}.app{display:block;margin:0;box-shadow:none;border-radius:0;background:#fff;min-height:0}.mn{padding:0}.pro{display:block;font-weight:800;margin-bottom:6px}.tw{overflow:visible}table{min-width:0}body.pmod #root{display:none!important}body:not(.pmod) #md{display:none!important}#md{position:static;background:none;padding:0}.mb{box-shadow:none;max-width:none;padding:0;background:#fff;color:#111}}
</style><style>:root{--out:#d9dfe8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--out:#000d1a}}
:root[data-theme="dark"]{--out:#000d1a}
body{background:var(--out)}
.app{max-width:1380px;margin:16px auto;border-radius:26px;overflow:hidden;background:var(--bg);min-height:calc(100vh - 32px);box-shadow:0 20px 50px #00132a33}
.sb{position:relative;flex:none;display:flex;flex-direction:column;gap:4px;padding:18px 14px;width:235px}
.nv{border-radius:99px;padding:12px 16px}.nv.on{background:var(--cy);color:var(--mid)}
.sbc{margin-top:auto;background:#fff;color:var(--mid);border-radius:16px;padding:14px;text-align:center;margin-bottom:8px}.sbc b{font-size:22px;display:block}.sbc small{color:#62748a}
.mn{margin:0;padding:22px 24px}.mn>h1{display:none}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.hd h1{margin:0;font-size:22px}
.hr{display:flex;align-items:center;gap:10px}.hr input{width:210px;border-radius:99px;padding:9px 14px}
.av{width:38px;height:38px;border-radius:50%;background:var(--cy);color:var(--mid);display:grid;place-items:center;font-weight:800}
.c,.tw{border-radius:18px;border:0}.c.hl{border-radius:18px}
.dg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}.dl,.dr{display:flex;flex-direction:column;gap:14px;min-width:0}
.s4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.s2{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.sh{display:flex;justify-content:space-between;align-items:center}.ic{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;font-size:13px}
.st b{display:block;font-size:24px;margin:6px 0 2px}
.stp{height:14px;margin-top:8px;background:repeating-linear-gradient(90deg,var(--bd) 0 3px,transparent 3px 6px)}.stp i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--cy) 0 3px,transparent 3px 6px)}
.dk{background:var(--mid);color:#fff;border-radius:18px;padding:16px}.dk small{color:#9fb6d0}
.tl{margin:10px 0 0 6px;padding:0;list-style:none}.tl li{display:flex;gap:10px;padding:8px 0 8px 16px;border-left:2px solid var(--bd);position:relative;justify-content:space-between;font-size:14px}
.tl li::before{content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--cy)}.tl li.x::before{background:var(--or)}.tl small{display:block;color:var(--mu)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}.wd{font-size:11px;color:var(--mu)}.dy{padding:6px 0;border-radius:8px;font-size:13px}.tdy{background:var(--mid);color:#fff}.du{box-shadow:inset 0 -3px 0 var(--or)}
.ai{background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}.ai small{display:block;color:var(--mu)}
.pl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}a.btn{text-decoration:none;display:inline-block}.bd.New{background:#e7ecf2;color:#445}.bd.Preparing{background:#ffecd0;color:#a05a00}.bd.Submitted{background:#e3ecff;color:#1d4ed8}.ap{outline:2px solid #d4101b;outline-offset:-2px}.bd.Planned,.bd.Upcoming{background:#e7ecf2;color:#445}.bd.leave{background:#e3ecff;color:#1d4ed8}.cg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:1100px){.cg2{grid-template-columns:1fr}}.gsb{display:none}@media(max-width:820px){.gsb{display:inline-block}}.sec{margin:18px 0 8px;font-size:14px;color:var(--cy);border-bottom:1px solid var(--bd);padding-bottom:4px}.ph{border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;flex:none}.bd.Rejected{background:#fde3e4;color:#b3252b}.bd.Documents,.bd.Additional,.bd.Document{background:#ffecd0;color:#a05a00}.bd.University,.bd.Interview,.bd.Application{background:#e3ecff;color:#1d4ed8}.bd.Needs{background:#ffecd0;color:#a05a00}.bd.Broken,.bd.Disposed{background:#fde3e4;color:#b3252b}.bd.Absent{background:#fde3e4;color:#b3252b}.bd.Late,.bd.Half{background:#ffecd0;color:#a05a00}.bd.Closed{background:#fde3e4;color:#b3252b}
@media(max-width:1100px){.dg{grid-template-columns:1fr}.s4{grid-template-columns:1fr 1fr}.s2{grid-template-columns:1fr}}
@media(max-width:820px){.app{margin:0;border-radius:0;min-height:100vh;display:block;box-shadow:none}.sb{position:fixed;top:0;bottom:0;left:0;width:260px;transform:translateX(-100%)}.sb.on{transform:none}.mn{padding:14px}.hr input{display:none}.hd h1{font-size:19px}}
.lgn{background:#f3f5f9}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lgn{background:#000d1a}}
.lgn .box{background:radial-gradient(circle at 0 0,#06408f 0,transparent 38%),radial-gradient(circle at 100% 100%,#0061ff 0,transparent 62%),radial-gradient(circle at 0 100%,#02060f 0,transparent 45%),#020812;color:#fff;border-radius:38px;padding:34px 26px;max-width:420px}
.lgn .box img{margin-bottom:34px}.lgn label{color:#fff;font-weight:800;font-size:18px;margin:14px 0 8px}
.lgn input{background:#ffffff0d;color:#fff;border:1px solid #ffffff40;border-radius:20px;height:54px;padding:0 16px;margin-top:8px}
.lgn .btn{height:54px;border-radius:20px;font-size:20px;margin-top:18px;background:#d4101b;color:#062033}
.lgn .hint{color:#fff;font-size:15px;margin:18px 0 0}

.lgn .box{background:#0000004d;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid #ffffff30;color:#fff}
.lgn .btn{background:#fff;color:#c40812}.lgn .box{max-width:330px;padding:20px 18px;border-radius:26px}.lgn .box img{max-width:220px;display:block;margin:0 auto 16px}.lgn label{font-size:14px;margin:10px 0 4px}.lgn input{height:42px;border-radius:13px;margin-top:4px;font-size:15px}.lgn .btn{height:44px;font-size:16px;border-radius:13px;margin-top:14px}.lgn .hint{font-size:12px;margin:12px 0 0;opacity:.85}
.agr{background:#fff;color:#111;max-width:210mm;margin:0 auto;padding:6px;font:13px/1.55 'Plus Jakarta Sans',Arial,sans-serif}
.agr .hdr{display:grid;grid-template-columns:1fr 72px 1fr;gap:8px;align-items:center}
.agr .hdr img{width:72px;height:auto;display:block;margin:0 auto}
.agr .hl,.agr .hr2{font-weight:800;font-size:14px;color:#555}.agr .hr2{text-align:right}
.agr .hl small,.agr .hr2 small{display:block;font-weight:600;font-size:11px}
.agr .ct2{text-align:center;font-size:11px;margin:8px 0 4px;color:#333}
.agr hr{border:0;border-top:3px solid #111;margin:6px 0 10px}
.agr .rf{display:flex;justify-content:space-between;font-weight:800}
.agr h2{font-size:14px;text-align:center;text-decoration:underline;margin:14px 0 8px}
.agr p{margin:0 0 9px;text-align:justify}.agr ol{margin:0 0 9px;padding-left:20px}.agr li{margin-bottom:5px;text-align:justify}
.agr .sl2{border-bottom:1px solid #111;height:34px;width:62%;margin:0 0 12px}
.agr table{border-collapse:collapse;width:100%;min-width:0;margin:4px 0 12px}.agr td{border:0;padding:3px 6px;white-space:normal;text-align:left}
.agr .ft2{border-top:1px solid #999;margin-top:18px;padding-top:6px;font-size:10px;text-align:center;color:#444}
